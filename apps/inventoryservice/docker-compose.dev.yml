name: custom-apps
services:
  postgres:
    image: postgres:17-alpine
    container_name: custom-apps-postgres-dev
    environment:
      POSTGRES_DB: custom_apps_dev_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d custom_apps_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - custom-apps-traefik

volumes:
  postgres_dev_data:

networks:
  custom-apps-traefik:
    name: custom-apps-traefik
